<script>
  window.addEventListener(
    "load",
    async function () {

      const endpoint =
        "https://doctorassist.ai/api/hms/integration/system/validate-widget-session";

      // ✅ Use the same valid token as the first block
      const bearerToken =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJJTlQtNTk3MTI2OGEtYWFhYy00Yzc4LWJlNTUtN2U2MzUzZWVhYzA4Iiwicm9sZSI6ImludGVncmF0b3IiLCJzY29wZXMiOltdLCJleHAiOjE3ODU5NTM1Nzd9.CWUez9FVNUInG0Vz0CELhIAOxl-KTIJbAKRXikdYs4A";

      const payload = {
        hospital_id: "JE3Xl2Jaeb",
        doctor_id: "DOC_999877",
        patient_id: "HMS-PAT-00988"
      };

      async function validateSession() {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${bearerToken}`
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`Validation failed: ${response.status}`);
        }

        return await response.json();
      }

      // Report Upload Widget
      try {
        const data = await validateSession();

        window.ReportUploadWidget?.init({
          containerId: "report-upload-widget",
          doctorId: data.doctor.doctor_sys_user_id,
          patientId: data.patient.patient_sys_user_id,
          appointmentId: data.appointment?.appointment_id
        });

        console.log("✅ Report Upload Widget Initialized");
      } catch (err) {
        console.error("❌ Report Upload Widget failed", err);
      }

      // Patient Portal Widget
      try {
        const data = await validateSession();

        window.PatientPortalWidget?.init({
          containerId: "patient-portal-widget",
          hospitalId: data.hospital.hospital_sys_user_id,
          doctorId: data.doctor.doctor_sys_user_id,
          patientId: data.patient.patient_sys_user_id,
          appointmentId: data.appointment?.appointment_id
        });

        console.log("✅ Patient Portal Initialized");
      } catch (err) {
        console.error("❌ Patient Portal Widget failed", err);
      }
    }
  );
</script>
