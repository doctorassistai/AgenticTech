<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow Engine — DoctorAssist.AI</title>
  <link rel="shortcut icon" href="../../../static/HMS_assets/images/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
  <script src="config.js"></script>

  <style>
    /* ─── RESET & BASE ─── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --bg-alt: #fafafa;
      --bg-tert: #f5f5f5;
      --text: #000000;
      --text-sec: #444444;
      --text-muted: #888888;
      --border: #e0e0e0;
      --border-str: #000000;
      --accent: #000000;
      --sidebar-w: 248px;
      --topbar-h: 56px;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Open Sans', sans-serif;
      font-weight: 300;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::selection { background: var(--accent); color: var(--bg); }

    /* ─── TOP BAR ─── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 300;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-brand {
      font-weight: 400;
      font-size: 0.9rem;
      letter-spacing: -0.01em;
      color: var(--text);
      text-decoration: none;
    }
    .topbar-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
    }
    .topbar-title {
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .active-badge {
      padding: 0.3rem 0.875rem;
      border: 1px solid var(--border);
      background: var(--bg-alt);
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-sec);
      transition: all 0.15s;
    }
    .active-badge.has-active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .topbar-icon-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: 1px solid var(--border);
      cursor: pointer; color: var(--text-sec);
      transition: all 0.15s;
    }
    .topbar-icon-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    /* ─── LEFT SIDEBAR ─── */
    .sidebar-left {
      position: fixed;
      left: 0; top: 0;
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 200;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .sidebar-left::-webkit-scrollbar { display: none; }

    .sidebar-header {
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.25rem;
    }
    .logo-box {
      width: 28px; height: 28px;
      background: var(--text);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 0.65rem;
      color: var(--bg);
    }
    .brand-name {
      font-weight: 400;
      font-size: 0.88rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .sidebar-meta-label {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      font-weight: 400;
      display: block;
      margin-bottom: 0.2rem;
    }
    .sidebar-meta-value {
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--text);
    }

    /* nav */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
      scrollbar-width: none;
    }
    .sidebar-nav::-webkit-scrollbar { display: none; }
    .nav-group-label {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      font-weight: 400;
      padding: 0.5rem 1.25rem 0.2rem;
      display: block;
    }
    .nav-btn {
      width: 100%;
      background: transparent;
      border: none;
      border-left: 2px solid transparent;
      text-align: left;
      padding: 0.52rem 1.25rem;
      font-size: 0.76rem;
      font-weight: 300;
      color: var(--text-sec);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: all 0.15s;
      font-family: 'Open Sans', sans-serif;
    }
    .nav-btn:hover {
      background: var(--bg-alt);
      color: var(--text);
    }
    .nav-btn.active {
      background: var(--bg-alt);
      color: var(--text);
      font-weight: 400;
      border-left-color: var(--accent);
    }

    /* sidebar footer */
    .sidebar-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logout-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      padding: 0.55rem 1rem;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text-sec);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Open Sans', sans-serif;
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }
    .logout-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    /* ─── RIGHT SIDEBAR (node categories) ─── */
    .sidebar-right {
      position: fixed;
      right: 0; top: var(--topbar-h);
      width: 300px;
      height: calc(100vh - var(--topbar-h));
      background: var(--bg);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--bg-alt);
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }
    .sidebar-right.open {
      transform: translateX(0);
    }
    .sidebar-right::-webkit-scrollbar { width: 4px; }
    .sidebar-right::-webkit-scrollbar-track { background: var(--bg-alt); }
    .sidebar-right::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .right-sidebar-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-alt);
      position: sticky; top: 0; z-index: 10;
    }
    .right-sidebar-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 400;
      color: var(--text-muted);
    }

    /* ─── MAIN CONTENT ─── */
    .main-content {
      margin-left: var(--sidebar-w);
      padding-top: var(--topbar-h);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: margin-right 0.3s ease;
    }
    .main-content.sidebar-open {
      margin-right: 300px;
    }
    .content-body {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--topbar-h) - 4rem);
      text-align: center;
    }
    .empty-icon-box {
      width: 80px; height: 80px;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 2rem;
    }
    .empty-title {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    .empty-sub {
      font-size: 0.82rem;
      color: var(--text-sec);
      max-width: 380px;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .pulse-dots {
      display: flex; gap: 6px;
    }
    .pulse-dot {
      width: 6px; height: 6px;
      border: 1px solid var(--border);
      border-radius: 50%;
      animation: dotPulse 2s infinite;
    }
    .pulse-dot:nth-child(2) { animation-delay: 0.3s; }
    .pulse-dot:nth-child(3) { animation-delay: 0.6s; }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; background: transparent; }
      50% { opacity: 1; background: var(--text); border-color: var(--text); }
    }

    /* ─── CONFIG PANEL ─── */
    #config-panel { max-width: 800px; }

    /* category card */
    .category-card {
      border: 1px solid var(--border);
      margin-bottom: -1px;
      transition: border-color 0.15s;
    }
    .category-card:hover { border-color: var(--text-sec); z-index: 1; position: relative; }
    .category-header {
      padding: 0.875rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: var(--bg);
      transition: background 0.15s;
    }
    .category-header:hover { background: var(--bg-alt); }
    .category-header.expanded { background: var(--bg-alt); }
    .cat-left {
      display: flex; align-items: center; gap: 10px;
    }
    .cat-chevron {
      font-size: 0.55rem;
      color: var(--text-muted);
      transition: transform 0.2s;
    }
    .cat-chevron.open { transform: rotate(90deg); }
    .cat-icon { font-size: 0.75rem; color: var(--text-sec); width: 14px; }
    .cat-name {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text);
    }
    .cat-badge {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.18rem 0.5rem;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 400;
    }
    .cat-badge.has-enabled {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    /* feature row */
    .features-container {
      border-top: 1px solid var(--border);
    }
    .feature-row {
      padding: 0.75rem 1.25rem 0.75rem 2.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .feature-row:last-child { border-bottom: none; }
    .feature-row:hover { background: var(--bg-alt); }
    .feature-row.enabled-row { background: var(--bg-alt); }
    .feature-left { display: flex; align-items: center; gap: 9px; }
    .feature-icon { font-size: 0.7rem; color: var(--text-muted); width: 13px; }
    .feature-name {
      font-size: 0.74rem;
      font-weight: 300;
      color: var(--text-sec);
    }
    .feature-configured {
      font-size: 0.6rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      font-weight: 400;
      letter-spacing: 0.04em;
    }
    .feature-right { display: flex; align-items: center; gap: 10px; }
    .edit-icon {
      font-size: 0.65rem;
      color: var(--border);
      cursor: pointer;
      transition: color 0.15s;
    }
    .edit-icon:hover { color: var(--text); }

    /* toggle */
    .toggle-wrap { position: relative; cursor: pointer; }
    .toggle-track {
      width: 36px; height: 20px;
      border-radius: 10px;
      background: var(--border);
      transition: background 0.2s;
      position: relative;
    }
    .toggle-track.on {
      background: var(--accent);
    }
    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--bg);
      transition: transform 0.2s;
    }
    .toggle-track.on .toggle-thumb {
      transform: translateX(16px);
    }

    /* ─── CONFIG FORM ─── */
    .config-card {
      background: var(--bg);
      border: 1px solid var(--border);
      animation: fadeSlideIn 0.25s ease;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .config-card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-alt);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .config-card-header-left { display: flex; align-items: center; gap: 12px; }
    .config-icon-box {
      width: 36px; height: 36px;
      background: var(--text);
      display: flex; align-items: center; justify-content: center;
      color: var(--bg);
      font-size: 0.75rem;
      flex-shrink: 0;
    }
    .config-title {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    .config-category {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 2px;
    }
    .config-loaded-tag {
      font-size: 0.6rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      letter-spacing: 0.06em;
      margin-top: 4px;
    }
    .close-btn {
      width: 28px; height: 28px;
      background: none; border: 1px solid var(--border);
      cursor: pointer; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      transition: all 0.15s;
    }
    .close-btn:hover { border-color: var(--text); color: var(--text); }

    .config-body { padding: 1.5rem; }

    .form-group { margin-bottom: 1.5rem; }
    .form-label {
      display: block;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 0.5rem;
    }
    .form-input, .form-select {
      width: 100%;
      max-width: 380px;
      padding: 0.6rem 0.875rem;
      border: 1px solid var(--border);
      background: var(--bg);
      font-family: 'Open Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--text);
    }
    .form-hint {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    /* template buttons */
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .template-btn {
      background: var(--bg);
      border: none;
      padding: 1rem 1.25rem;
      text-align: left;
      cursor: pointer;
      font-family: 'Open Sans', sans-serif;
      transition: background 0.15s;
      border-left: 2px solid transparent;
    }
    .template-btn:hover { background: var(--bg-alt); }
    .template-btn.selected {
      background: var(--bg-alt);
      border-left-color: var(--accent);
    }
    .template-btn-name {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 0.2rem;
    }
    .template-btn-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* rules textarea */
    .rules-wrap { position: relative; }
    .rules-textarea {
      width: 100%;
      padding: 0.875rem;
      border: 1px solid var(--border);
      background: var(--bg);
      font-family: 'Open Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--text);
      resize: none;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.6;
    }
    .rules-textarea:focus { border-color: var(--text); }
    .rules-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .voice-btn {
      width: 30px; height: 30px;
      background: var(--text);
      color: var(--bg);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem;
      transition: opacity 0.15s;
    }
    .voice-btn:hover { opacity: 0.7; }
    .voice-btn.recording { background: #444; }
    .clear-btn {
      width: 30px; height: 30px;
      background: none;
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem;
      transition: all 0.15s;
    }
    .clear-btn:hover { border-color: var(--text); color: var(--text); }

    /* checkboxes */
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 0.5rem;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .checkbox-item:hover { border-color: var(--text-sec); }
    .checkbox-item input[type="checkbox"] {
      width: 13px; height: 13px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .checkbox-label {
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--text-sec);
    }

    /* config footer */
    .config-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--bg-alt);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn-cancel {
      padding: 0.55rem 1.25rem;
      background: var(--bg);
      color: var(--text-sec);
      border: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 400;
      cursor: pointer;
      font-family: 'Open Sans', sans-serif;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }
    .btn-cancel:hover { border-color: var(--text); color: var(--text); }
    .btn-test {
      padding: 0.55rem 1.25rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--text);
      font-size: 0.72rem;
      font-weight: 400;
      cursor: pointer;
      font-family: 'Open Sans', sans-serif;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }
    .btn-test:hover { background: var(--text); color: var(--bg); }
    .btn-save {
      padding: 0.55rem 1.25rem;
      background: var(--text);
      color: var(--bg);
      border: 1px solid var(--text);
      font-size: 0.72rem;
      font-weight: 400;
      cursor: pointer;
      font-family: 'Open Sans', sans-serif;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }
    .btn-save:hover { background: transparent; color: var(--text); }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      top: calc(var(--topbar-h) + 12px);
      right: 1.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 0.875rem 1.25rem;
      z-index: 9999;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.25s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .toast.success { border-left-color: var(--accent); }
    .toast.test { border-left-color: var(--text-sec); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .toast-icon { font-size: 0.7rem; color: var(--text-muted); }
    .toast-title { font-weight: 400; color: var(--text); }
    .toast-sub { font-size: 0.65rem; color: var(--text-muted); margin-top: 1px; }

    /* ─── SCROLLBAR ─── */
    .content-body::-webkit-scrollbar { width: 4px; }
    .content-body::-webkit-scrollbar-track { background: var(--bg-alt); }
    .content-body::-webkit-scrollbar-thumb { background: var(--border); }

    /* ─── HIDDEN ─── */
    .hidden { display: none !important; }

    /* ─── output cats ─── */
    .output-cats-section {
      margin-bottom: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

<body>

<!-- ════════════════ TOP BAR ════════════════ -->
<nav class="topbar">
  <div class="topbar-left">
    <a href="#" class="topbar-brand">DoctorAssist.AI</a>
    <div class="topbar-divider"></div>
    <span class="topbar-title">Workflow Engine</span>
  </div>
  <div class="topbar-right">
    <div id="active-badge" class="active-badge">
      <span id="active-count">0</span> active
    </div>
    <button id="sidebar-toggle" class="topbar-icon-btn" title="Node categories">
      <i class="fas fa-sliders-h" style="font-size:0.7rem;"></i>
    </button>
  </div>

function isFeatureAllowed(featureId) {
  const rules = FEATURE_SPECIALITY_RULES[featureId];
  if (!rules) return true;
  if (rules.includes("all")) return true;
  if (!state.doctorSpeciality) return false;
  return rules.includes(state.doctorSpeciality);
}

// ── DOM REFS ──
const rightSidebar = document.getElementById('right-sidebar');
const mainContent = document.getElementById('main-content');
const emptyState = document.getElementById('empty-state');
const configPanel = document.getElementById('config-panel');
const categoriesContainer = document.getElementById('categories-container');
const activeBadge = document.getElementById('active-badge');
const activeCountEl = document.getElementById('active-count');

// ── SIDEBAR TOGGLE ──
document.getElementById('sidebar-toggle').addEventListener('click', () => {
  state.sidebarOpen = !state.sidebarOpen;
  rightSidebar.classList.toggle('open', state.sidebarOpen);
  mainContent.classList.toggle('sidebar-open', state.sidebarOpen);
});

// ── ACTIVE COUNT ──
function updateActiveCount() {
  const count = state.activeFeatures.size;
  activeCountEl.textContent = count;
  activeBadge.classList.toggle('has-active', count > 0);
}

// ── RENDER CATEGORIES ──
function renderCategories() {
  categoriesContainer.innerHTML = '';
  state.categories.forEach(category => {
    const card = document.createElement('div');
    card.className = 'category-card';

    const header = document.createElement('div');
    header.className = `category-header ${category.expanded ? 'expanded' : ''}`;
    header.innerHTML = `
      <div class="cat-left">
        <i class="fas fa-chevron-right cat-chevron ${category.expanded ? 'open' : ''}"></i>
        <i class="${category.icon} cat-icon"></i>
        <span class="cat-name">${category.name}</span>
      </div>
      <span class="cat-badge ${category.enabledCount > 0 ? 'has-enabled' : ''}">${category.enabledCount} on</span>
    `;
    header.addEventListener('click', () => toggleCategory(category.id));
    card.appendChild(header);

    if (category.expanded) {
      const featuresDiv = document.createElement('div');
      featuresDiv.className = 'features-container';

      category.features.filter(f => isFeatureAllowed(f.id)).forEach(feature => {
        const row = document.createElement('div');
        row.className = `feature-row ${feature.enabled ? 'enabled-row' : ''} ${state.configuredFeature === feature.id ? 'enabled-row' : ''}`;

        row.innerHTML = `
          <div class="feature-left">
            <i class="${feature.icon} feature-icon"></i>
            <div>
              <div class="feature-name">${feature.name}</div>
              ${feature.configured ? `<div class="feature-configured"><i class="fas fa-check" style="font-size:0.55rem;"></i> configured</div>` : ''}
            </div>
          </div>
          <div class="feature-right">
            ${feature.configured ? '<i class="fas fa-pencil-alt edit-icon"></i>' : ''}
            <div class="toggle-wrap">
              <div class="toggle-track ${feature.enabled ? 'on' : ''}">
                <div class="toggle-thumb"></div>
              </div>
            </div>
          </div>
        `;

        const toggleEl = row.querySelector('.toggle-track');
        toggleEl.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFeature(feature.id, category.id);
        });

        if (feature.enabled) {
          row.style.cursor = 'pointer';
          row.addEventListener('click', (e) => {
            if (e.target.closest('.toggle-wrap')) return;
            openConfig(feature.id, category.id);
          });
        }

        featuresDiv.appendChild(row);
      });
      card.appendChild(featuresDiv);
    }

    categoriesContainer.appendChild(card);
  });
}

function toggleCategory(categoryId) {
  const cat = state.categories.find(c => c.id === categoryId);
  if (cat) { cat.expanded = !cat.expanded; renderCategories(); }
}

function toggleFeature(featureId, categoryId) {
  const cat = state.categories.find(c => c.id === categoryId);
  const feature = cat.features.find(f => f.id === featureId);
  if (!feature) return;

  feature.enabled = !feature.enabled;

  if (feature.id === 'patient-profile') {
    feature.enabled ? persistPatientEnable(feature) : persistPatientDisable(feature);
  } else {
    feature.enabled ? persistEnable(feature, cat) : persistDisable(feature, cat);
  }

  if (feature.enabled) {
    state.activeFeatures.add(feature.id);
    openConfig(featureId, categoryId);
  } else {
    state.activeFeatures.delete(feature.id);
  }

  cat.enabledCount = cat.features.filter(f => f.enabled).length;
  updateActiveCount();
  renderCategories();
}

// ── OPEN CONFIG ──
async function openConfig(featureId, categoryId) {
  const cat = state.categories.find(c => c.id === categoryId);
  const feature = cat.features.find(f => f.id === featureId);
  if (!feature || !feature.enabled) return;

  state.configuredFeature = featureId;
  emptyState.classList.add('hidden');
  configPanel.classList.remove('hidden');

  const urlParams = new URLSearchParams(window.location.search);
  const doctorId = urlParams.get('doctor_id');
  let featureConfig = null;

  if (doctorId) {
    if (featureId === 'screening-section') featureConfig = await getSavedScreeningFeature(doctorId);
    else if (featureId === 'patient-profile') featureConfig = await loadPatientProfileConfig(doctorId);
    else if (featureId !== 'pre-screening-section') featureConfig = await getFeatureConfiguration(doctorId, featureId);
  }

  await renderConfigForm(feature, cat, featureConfig);
  renderCategories();
}

function closeConfig() {
  state.configuredFeature = null;
  emptyState.classList.remove('hidden');
  configPanel.classList.add('hidden');
  renderCategories();
}

// ── RENDER CONFIG FORM ──
async function renderConfigForm(feature, category, featureConfig = null) {
  const urlParams = new URLSearchParams(window.location.search);
  const doctorId = urlParams.get('doctor_id');

  let html = '';
  if (feature.id === 'screening-section') {
    html = renderScreeningForm(feature, category);
  } else if (feature.id === 'patient-profile') {
    html = renderPatientProfileForm(feature, category, featureConfig);
  } else if (feature.id === 'pre-screening-section') {
    html = renderPreScreeningForm(feature, category);
    setTimeout(() => initPreScreeningForm(feature, category), 100);
  } else {
    const templates = await fetchFeatureTemplates({ doctorId, feature, category });
    state.featureTemplates = templates?.analysis_templates?.templates || [];
    html = renderStandardForm(feature, category, state.featureTemplates, featureConfig);
  }

  configPanel.innerHTML = html;
  setupConfigListeners(feature, category, featureConfig);
  setTimeout(setupRulesVoice, 0);
  if (feature.id !== 'screening-section') attachTemplateHandlers();
}

            ${templates.map(t => `
              <button type="button" class="template-btn analysis-template-btn ${t.analysis_prompt===rules?'selected':''}"

                data-template-prompt="${encodeURIComponent(t.analysis_prompt)}">
                <div class="template-btn-name">${t.template_name}</div>

            <option value="timeline" ${displayMethod==='timeline'?'selected':''}>Timeline</option>

        </div>

        ${selectedOutputCats.length > 0 ? `
        <div class="form-group">
          <label class="form-label">Selected Output Categories</label>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            ${selectedOutputCats.map(c => `<span style="font-size:0.65rem;padding:0.2rem 0.6rem;border:1px solid var(--border);color:var(--text-muted);">${c}</span>`).join('')}

// ── SETUP CONFIG LISTENERS ──
function setupConfigListeners(feature, category, featureConfig = null) {
  document.getElementById('close-config')?.addEventListener('click', closeConfig);
  document.getElementById('cancel-config')?.addEventListener('click', closeConfig);

  if (feature.id === 'screening-section') {
    const urlParams = new URLSearchParams(window.location.search);
    const doctorId = urlParams.get('doctor_id');

    document.getElementById('add-screening-field')?.addEventListener('click', () => {
      document.getElementById('screening-fields')?.insertAdjacentHTML('beforeend', screeningFieldRow());
    });

    document.getElementById('screening-fields')?.addEventListener('click', (e) => {
      if (e.target.closest('.remove-field')) e.target.closest('div').remove();
    });

    document.getElementById('save-config')?.addEventListener('click', () => saveConfig(feature, category));

    (async () => {
      const saved = await getSavedScreeningFeature(doctorId);
      const savedFields = saved?.screening_section?.fields || [];
      const { important, optional } = await getScreeningFields(doctorId);
      const container = document.getElementById('screening-fields');
      if (container) container.innerHTML = '';
      const fieldsToShow = savedFields.length > 0 ? savedFields : important;
      fieldsToShow.forEach(f => container?.insertAdjacentHTML('beforeend', screeningFieldRow(f)));
      renderOptionalVitalChips(optional);
    })();
    return;
  }

  if (feature.id === 'patient-profile') {
    document.getElementById('save-config')?.addEventListener('click', () => savePatientProfileConfig(feature, category));
    return;
  }

  const triggerMethod = document.getElementById('trigger-method');
  const buttonLabelContainer = document.getElementById('button-label-container');
  if (triggerMethod && buttonLabelContainer) {
    if (featureConfig?.trigger?.type === 'button-click') buttonLabelContainer.classList.remove('hidden');
    triggerMethod.addEventListener('change', (e) => {
      buttonLabelContainer.classList.toggle('hidden', e.target.value !== 'button-click');
    });
  }

  document.getElementById('test-config')?.addEventListener('click', () => testConfig(feature, category));
  document.getElementById('save-config')?.addEventListener('click', () => saveConfig(feature, category));
}

// ── RULES VOICE ──
function setupRulesVoice() {
  let recorder, chunks = [], recording = false;
  const voiceBtn = document.getElementById('rules-voice-btn');
  const clearBtn = document.getElementById('rules-clear-btn');
  const ta = document.getElementById('rules-textarea');
  if (!voiceBtn || !clearBtn || !ta) return;

  const updateIcon = () => {
    voiceBtn.innerHTML = recording ? '<i class="fas fa-stop"></i>' : '<i class="fas fa-microphone"></i>';
    voiceBtn.classList.toggle('recording', recording);
  };

  voiceBtn.addEventListener('click', async () => {
    if (recording) {
      recorder.stop(); recorder.stream.getTracks().forEach(t => t.stop());
      recording = false; updateIcon();
      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type:'audio/webm' });
        const fd = new FormData(); fd.append('file', blob, 'rules.webm');
        const res = await fetch(`${API_BASE}/hms/users/ai/elevenlabs/api/transcribe_labs`, { method:'POST', body:fd });
        const d = await res.json();
        const text = d?.text || '';
        const cur = ta.value.trim();
        ta.value = cur ? cur.replace(/,\s*$/, '') + ', ' + text.trim() : text.trim();
      };
    } else {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      recorder = new MediaRecorder(stream); chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.start(); recording = true; updateIcon();
    }
  });

  clearBtn.addEventListener('click', () => { ta.value = ''; });
}

// ── SAVE / TEST ──
async function saveConfig(feature, category) {
  feature.configured = true;
  const urlParams = new URLSearchParams(window.location.search);
  const doctorId = urlParams.get('doctor_id');
  let payload, endpoint;

  if (feature.id === 'patient-profile') {
    payload = buildPatientProfilePayload(feature, category); payload.doctor_id = doctorId;
    endpoint = `${API_BASE}/hms/users/orchestration/doctor_patient_profile_save`;
  } else if (feature.id === 'screening-section') {
    payload = buildScreeningPayload(feature, category);
    endpoint = `${API_BASE}/hms/users/orchestration/doctor_screening_feature_save`;
  } else {
    payload = buildFeatureConfigJSON(feature, category); payload.doctor_id = doctorId;
    payload.selected_output_categories = getSelectedOutputCategories();
    endpoint = `${API_BASE}/hms/users/orchestration/doctor-feature-save`;
  }

  try {
    const res = await fetch(endpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error();
    showToast(feature.name, 'saved');
    updateActiveCount(); renderCategories();
  } catch { alert('Error saving configuration'); }
}

async function savePatientProfileConfig(feature, category) {
  feature.configured = true;
  const payload = buildPatientProfilePayload(feature, category);
  try {
    const res = await fetch(`${API_BASE}/hms/users/orchestration/doctor_patient_profile_save`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error();
    closeConfig(); showToast(feature.name, 'saved'); updateActiveCount(); renderCategories();
  } catch { alert('Error saving patient profile'); }
}

async function testConfig(feature, category) {
  const urlParams = new URLSearchParams(window.location.search);
  const doctorId = urlParams.get('doctor_id');
  const payload = {
    feature_id: feature.id, feature_name: feature.name, doctor_id: doctorId,
    trigger: { type: document.getElementById('trigger-method')?.value || 'page-reload', button_label: document.getElementById('button-label')?.value },
    rules: document.getElementById('rules-textarea')?.value || '',

  try {

}

function updateFeatureStates(enabledFeatures = [], configuredFeatures = [], patientProfileConfig = null) {
  state.categories.forEach(cat => {
    cat.features.forEach(f => { f.enabled = false; f.configured = false; state.activeFeatures.delete(f.id); });
    cat.enabledCount = 0;
  });

  state.categories.forEach(cat => {
    cat.features.forEach(f => {
      f.enabled = enabledFeatures.some(ef => ef.feature_id === f.id);
      f.enabled ? state.activeFeatures.add(f.id) : state.activeFeatures.delete(f.id);
    });
  });

  configuredFeatures.forEach(cf => {
    if (cf.feature_id === 'screening-section') return;
    state.categories.forEach(cat => {
      cat.features.forEach(f => {
        if (f.id === cf.feature_id && cf.configured) { f.configured = true; if (cf.feature_name) f.name = cf.feature_name; }
      });
    });
  });

  if (patientProfileConfig) {
    state.categories.forEach(cat => {
      cat.features.forEach(f => {
        if (f.id === 'patient-profile') {
          f.enabled = patientProfileConfig.enabled || false;
          f.configured = patientProfileConfig.configured || false;
          if (patientProfileConfig.feature_name) f.name = patientProfileConfig.feature_name;
          f.enabled ? state.activeFeatures.add('patient-profile') : state.activeFeatures.delete('patient-profile');
          state.patientProfileFields.selected = patientProfileConfig.patient_profile?.fields || [];
        }
      });
    });
  }

  state.categories.forEach(cat => { cat.enabledCount = cat.features.filter(f => f.enabled).length; });
}

    } catch { alert('Save failed.'); }
    finally { btn.textContent = 'Save Questions'; btn.disabled = false; }

function setupPreScreeningVoice() {
  let recorder, chunks = [], recording = false;
  const btn = document.getElementById('voice-input-btn');
  const ta = document.getElementById('pre-screening-questions');
  const indicator = document.getElementById('processing-indicator');
  if (!btn) return;

  btn.addEventListener('click', async () => {
    if (recording) {
      recorder.stop(); recorder.stream.getTracks().forEach(t => t.stop());
      recording = false; btn.innerHTML = '<i class="fas fa-microphone"></i>'; btn.classList.remove('recording');
      recorder.onstop = async () => {
        indicator?.classList.remove('hidden');
        try {
          const blob = new Blob(chunks, { type:'audio/webm' }); const fd = new FormData(); fd.append('file', blob, 'ps.webm');
          const res = await fetch(`${API_BASE}/hms/users/ai/elevenlabs/api/transcribe_labs`, { method:'POST', body:fd });
          const d = await res.json(); const text = d?.text || '';
          if (ta) { ta.value = ta.value ? ta.value + '\n\n' + text : text; ta.scrollTop = ta.scrollHeight; }
          showToast('Transcription complete', 'saved');
        } catch {} finally { indicator?.classList.add('hidden'); }
      };
    } else {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      recorder = new MediaRecorder(stream); chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data); recorder.start();
      recording = true; btn.innerHTML = '<i class="fas fa-stop"></i>'; btn.classList.add('recording');
    }
  });
}

// ── LOGOUT ──
function handleLogout() {
  const doctorId = new URLSearchParams(window.location.search).get('doctor_id');
  fetch(`${API_BASE}/hms/users/auth/logout`, { method:'POST', credentials:'include' })
    .finally(() => { window.location.href = '/login'; });
}

// ── INIT ──
async function init() {
  renderCategories();
  const urlParams = new URLSearchParams(window.location.search);
  const doctorId = urlParams.get('doctor_id');
  if (!doctorId) return;

  state.doctorSpeciality = await fetchDoctorSpeciality(doctorId);
  const [enabledFeatures, savedFeatures, patientProfileConfig] = await Promise.all([
    loadEnabledFeatures(doctorId),
    loadDoctorFeatures(doctorId),
    loadPatientProfileConfig(doctorId)
  ]);
  updateFeatureStates(enabledFeatures, savedFeatures, patientProfileConfig);
  updateActiveCount();
  renderCategories();
}

document.addEventListener('DOMContentLoaded', init);
</script>
