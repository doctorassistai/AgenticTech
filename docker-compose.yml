services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: gateway
    ports:
      - "${GATEWAY_PORT}:8000"
    env_file:
      - .env
    depends_on:
      - rabbitmq
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m

  orchestration:
    build:
      context: .
      dockerfile: ./orchestration/Dockerfile
    container_name: orchestration
    env_file:
      - .env
    depends_on:
      - rabbitmq
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m

  agentic:
    build:
      context: .
      dockerfile: ./Agentic/Dockerfile
    container_name: agentic
    ports:
      - "${AGENTIC_PORT}:8000"
    env_file:
      - .env
    depends_on:
      - rabbitmq
      # - ollama
      - neo4j
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1536m   # 1.5GB — ML models, embeddings, LangGraph

  neo4j:
    image: neo4j:5
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      # Limit Neo4j's internal heap so it respects the container limit
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m  
    volumes:
      - neo4j_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024m

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "${OLLAMA_PORT}:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped

