    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m

  celery-legacy:
    build:
      context: .
      dockerfile: ./common/Dockerfile.celery
    container_name: celery-legacy
    depends_on:
      - rabbitmq
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: amqp://legacy_ai_user:strongpassword@rabbitmq:5672/legacy_pdf_ai
      # CELERY_RESULT_BACKEND: redis://redis:6379/0
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
    volumes:
      - /tmp/documents:/tmp/documents
      - /etc/localtime:/etc/localtime:ro
    command: >
      celery -A common.celery_worker.celery_app:celery_app worker
      --loglevel=info
      --pool=prefork
      --concurrency=4
      --prefetch-multiplier=1
      -Q legacy_queue
      -n legacy@%h
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024m   # 4 prefork workers x ~256MB each



  celery-agent-pdf:

    build:
      context: .
      dockerfile: ./common/Dockerfile.celery

    container_name: celery-agent-pdf

    depends_on:
      - rabbitmq
      - neo4j

    env_file:
      - .env

    environment:

      CELERY_BROKER_URL: amqp://legacy_ai_user:strongpassword@rabbitmq:5672/legacy_pdf_ai

      MONGO_URI: ${MONGO_URI}

      MONGO_DB: ${MONGO_DB}

    volumes:
      - /tmp/documents:/tmp/documents
      - /etc/localtime:/etc/localtime:ro

    command: >
      celery -A common.celery_worker.celery_app:celery_app worker
      --loglevel=info
      --pool=prefork
      --concurrency=1
      --prefetch-multiplier=1
      -Q agent_pdf_queue
      -n agent-pdf@%h

    restart: always

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 2048m

  celery-handwritten:
    build:
      context: .
      dockerfile: ./common/Dockerfile.celery
    container_name: celery-handwritten
    depends_on:
      - rabbitmq
    env_file:
