        function showOutputCategoriesSection(apiResponse) {
    const categories =
    apiResponse?.feature_output_categories?.possible_output_categories || [];


    
    if (categories.length === 0) {
        console.log("No output categories found in response");
        return;
    }
    
    // Find or create the output categories section
    let section = document.getElementById("output-categories-section");
    let container = document.getElementById("output-categories-container");
    
    // If section doesn't exist, create it
    if (!section) {
        // Create the section HTML
        const form = document.querySelector('.px-8.py-8');
        if (!form) return;
        
        // Insert before the action buttons
        const actionButtons = form.querySelector('.flex.justify-end.space-x-4.pt-6.border-t');
        if (actionButtons) {
            const newSectionHTML = `
                <div id="output-categories-section" class="mb-8">
                    <label class="block text-sm font-medium text-gray-700 mb-3">
                        Select Output Categories for Testing
                    </label>
                    <div id="output-categories-container" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <!-- Categories will be populated here -->
                    </div>
                    <p class="text-gray-500 text-sm mt-2">
                        Select which outputs this feature is allowed to generate for this doctor.
                    </p>
                </div>
            `;
            
            actionButtons.insertAdjacentHTML('beforebegin', newSectionHTML);
            
            // Update references
            section = document.getElementById("output-categories-section");
            container = document.getElementById("output-categories-container");
        }
    }
    
    if (!section || !container) return;
    
    // Clear existing content
    container.innerHTML = '';
    
    // Populate with categories from API
    categories.forEach(cat => {
    const sectionId = cat.section_id;
    const sectionName = cat.section_name;
    const id = `output-${sectionId}`;

    container.insertAdjacentHTML(
        "beforeend",
        `
        <div class="flex items-center">
            <input
                type="checkbox"
                id="${id}"
                name="output_categories"
                value="${sectionId}"
                class="h-5 w-5 text-blue-600 rounded border-gray-300"
            />
            <label for="${id}" class="ml-3 text-gray-700">
                ${sectionName}
            </label>
        </div>
        `
    );
});


    
    // Show the section
    section.classList.remove("hidden");
    section.classList.add("animate-fadeIn");
    
    console.log(`Displayed ${categories.length} output categories`);
}

}

// 2. Add new function to load enabled features
async function loadEnabledFeatures(doctorId) {
    try {
        const res = await fetch(
            `${API_BASE}/hms/users/orchestration/get-doctor-features/${doctorId}`
        );

        if (!res.ok) {
            console.warn("Could not load doctor features");
            return [];
        }

        const data = await res.json();

        // ✅ IMPORTANT: only return features where enabled === true
        return (data.features || []).filter(f => f.enabled === true);

    } catch (e) {
        console.error("❌ Failed to load features", e);
        return [];
    }
}

    } catch (e) {
        console.error("❌ Failed to load patient profile configuration", e);
        return null;
    }
}
// 3. Add function to update feature states based on enabled features
// 3. Update function to handle patient profile configuration
function updateFeatureStates(enabledFeatures = [], configuredFeatures = [], patientProfileConfig = null) {
    // Reset all features first
    state.categories.forEach(category => {
        category.features.forEach(feature => {
            feature.enabled = false;
            feature.configured = false;
            state.activeFeatures.delete(feature.id);
        });
        category.enabledCount = 0; // Reset count
    });

    // ✅ Process ALL enabled features (INCLUDING screening)
state.categories.forEach(category => {
    category.features.forEach(feature => {
        const isEnabled = enabledFeatures.some(
            ef => ef.feature_id === feature.id
        );

        feature.enabled = isEnabled;

        if (isEnabled) {
            state.activeFeatures.add(feature.id);
        } else {
            state.activeFeatures.delete(feature.id);
        }
    });
});


    // Process configured features (excluding screening since it has separate config)
    configuredFeatures.forEach(configFeature => {
        // ✅ Keep screening excluded from standard config processing
        if (configFeature.feature_id === 'screening-section') return;
        
        state.categories.forEach(category => {
            category.features.forEach(feature => {
                if (feature.id === configFeature.feature_id && configFeature.configured === true) {
                    feature.configured = true;
                    
                    // Update display name if different from default
                    if (configFeature.feature_name && configFeature.feature_name !== feature.name) {
                        feature.name = configFeature.feature_name;
                    }
                }
            });
        });
    });

    // ✅ Process patient profile configuration if available
    if (patientProfileConfig) {
        console.log("Processing patient profile config:", patientProfileConfig);
        
        state.categories.forEach(category => {
            category.features.forEach(feature => {
                if (feature.id === 'patient-profile') {
                    // Set enabled and configured based on API response
                    feature.enabled = patientProfileConfig.enabled || false;
                    feature.configured = patientProfileConfig.configured || false;
                    
                    // Update display name
                    if (patientProfileConfig.feature_name) {
                        feature.name = patientProfileConfig.feature_name;
                    }
                    
                    // Update active features set
                    if (feature.enabled) {
                        state.activeFeatures.add('patient-profile');
                    } else {
                        state.activeFeatures.delete('patient-profile');
                    }
                    
                    // Update selected fields in state
                    const selectedFields = patientProfileConfig.patient_profile?.fields || [];
                    state.patientProfileFields.selected = selectedFields;
                    
                    console.log("Updated patient profile:", {
                        enabled: feature.enabled,
                        configured: feature.configured,
                        selectedFields: selectedFields
                    });
                }
            });
        });
    }

    // ✅ Update enabled counts for ALL categories
    state.categories.forEach(category => {
        category.enabledCount = category.features.filter(f => f.enabled).length;
    });
}
        // Set up event listeners
        function setupEventListeners() {
            sidebarToggle.addEventListener('click', toggleSidebar);
            
            // Close config when clicking outside (for demo purposes)
            document.addEventListener('click', (e) => {
                if (e.target.id === 'close-config' || e.target.closest('#close-config')) {
                    closeConfig();
                }
            });
        }

        // Toggle sidebar visibility
        function toggleSidebar() {
            state.sidebarOpen = !state.sidebarOpen;
            updateSidebar();
        }

        // Update sidebar UI
        function updateSidebar() {
            if (state.sidebarOpen) {
                sidebar.classList.remove('w-0', 'invisible');
                sidebar.classList.add('w-80');
                mainContent.classList.remove('ml-0');
                mainContent.classList.add('ml-0');
            } else {
                sidebar.classList.remove('w-80');
                sidebar.classList.add('w-0', 'invisible');
                mainContent.classList.remove('ml-0');
                mainContent.classList.add('ml-0');
            }
        }

        // Update active node count
        function updateActiveCount() {
            const count = state.activeFeatures.size;
            activeCount.textContent = count;
            
            // Update badge color based on count
            if (count === 0) {
                activeBadge.className = 'px-4 py-2 bg-gray-100 text-gray-700 rounded-full border border-gray-200 font-medium';
            } else if (count < 5) {
                activeBadge.className = 'px-4 py-2 bg-blue-50 text-blue-700 rounded-full border border-blue-100 font-medium';
            } else {
                activeBadge.className = 'px-4 py-2 bg-green-50 text-green-700 rounded-full border border-green-100 font-medium';
            }
        }
        function isFeatureAllowedForDoctor(featureId) {
            const allowedSpecialities = FEATURE_SPECIALITY_RULES[featureId];

            // ✅ If no rule → common feature
            if (!allowedSpecialities) return true;

            // ✅ Explicitly common
            if (allowedSpecialities.includes("all")) return true;

            // ❌ No speciality info yet → hide restricted features
            if (!state.doctorSpeciality) return false;

            // ✅ Match doctor speciality
            return allowedSpecialities.includes(state.doctorSpeciality);

                // Features list (collapsible)
                const featuresContainer = document.createElement('div');
                featuresContainer.className = `border-t border-gray-100 ${category.expanded ? '' : 'hidden'}`;

                    featureElement.className = `p-4 flex items-center justify-between border-b border-gray-50 last:border-b-0 ${feature.enabled ? 'node-active' : ''} ${state.configuredFeature === feature.id ? 'bg-blue-50' : ''}`;
                    
                    featureElement.innerHTML = `

                            <div>
                                <div class="font-medium text-gray-800">${feature.name}</div>
                                ${feature.configured ? '<div class="text-xs text-green-600 flex items-center"><i class="fas fa-check-circle mr-1"></i> Configured</div>' : ''}
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            ${feature.configured ? '<i class="fas fa-edit text-gray-400 cursor-pointer hover:text-blue-500"></i>' : ''}
                            <div class="relative">
                                <input type="checkbox" ${feature.enabled ? 'checked' : ''} class="sr-only feature-toggle" data-feature-id="${feature.id}" data-category-id="${category.id}">
                                <div class="toggle-bg w-12 h-6 rounded-full ${feature.enabled ? 'bg-blue-500' : 'bg-gray-300'}"></div>
                                <div class="toggle-circle absolute left-1 top-1 w-4 h-4 rounded-full bg-white transition-transform ${feature.enabled ? 'transform translate-x-6' : ''}"></div>
                            </div>
                        </div>
                    `;
                    
                    // Add event listeners to feature row
                    const toggleCheckbox = featureElement.querySelector('.feature-toggle');
                    const toggleBg = featureElement.querySelector('.toggle-bg');
                    const toggleCircle = featureElement.querySelector('.toggle-circle');
                    
                    toggleCheckbox.addEventListener('change', () => toggleFeature(feature.id, category.id));
                    
                    // Also make the toggle area clickable
                    toggleBg.addEventListener('click', () => {
                        toggleCheckbox.checked = !toggleCheckbox.checked;
                        toggleCheckbox.dispatchEvent(new Event('change'));
                    });
                    
                    toggleCircle.addEventListener('click', () => {
                        toggleCheckbox.checked = !toggleCheckbox.checked;
                        toggleCheckbox.dispatchEvent(new Event('change'));
                    });
                    
                    // If enabled, make the entire row clickable to configure
                    if (feature.enabled) {
                        featureElement.style.cursor = 'pointer';
                        featureElement.addEventListener('click', (e) => {
                            if (
                                e.target.closest('input') ||
                                e.target.closest('button') ||
                                e.target.closest('.toggle-bg') ||
                                e.target.closest('.toggle-circle')
                            ) return;

                            openConfig(feature.id, category.id);
                        });
                    }
                    
                    featuresContainer.appendChild(featureElement);
                });
                
                categoryElement.appendChild(featuresContainer);
                categoriesContainer.appendChild(categoryElement);
            });
        }

        // Toggle category expansion
        function toggleCategory(categoryId) {
            const category = state.categories.find(c => c.id === categoryId);
            if (category) {
                category.expanded = !category.expanded;
                renderCategories();
            }
        }

        // Toggle feature on/off
      function toggleFeature(featureId, categoryId) {
    const category = state.categories.find(c => c.id === categoryId);
    const feature = category.features.find(f => f.id === featureId);
    if (!feature) return;

    feature.enabled = !feature.enabled;

    // ✅ PATIENT PROFILE → use patient collection
    if (feature.id === "patient-profile") {
        if (feature.enabled) {
            persistPatientEnable(feature);
            openConfig(featureId, categoryId);
        } else {
            persistPatientDisable(feature);
        }
    }
    // ✅ ALL OTHER FEATURES → existing logic
    else {
        if (feature.enabled) {
            persistEnable(feature, category);
            openConfig(featureId, categoryId);
        } else {
            persistDisable(feature, category);
        }
    }

    category.enabledCount = category.features.filter(f => f.enabled).length;
    updateActiveCount();
    renderCategories();
}


        // Open configuration panel for a feature
        // Update the openConfig function
async function openConfig(featureId, categoryId) {
    const category = state.categories.find(c => c.id === categoryId);
    const feature = category.features.find(f => f.id === featureId);
    
    if (!feature || !feature.enabled) return;
    
    // Set as configured feature
    state.configuredFeature = featureId;
    
    // Hide empty state, show config panel
    emptyState.classList.add('hidden');
    configPanel.classList.remove('hidden');
    configPanel.classList.add('config-card-enter');
    
    // Get doctor ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const doctorId = urlParams.get("doctor_id");
    
    let featureConfig = null;
    
    // Load configuration for specific feature types
    if (doctorId) {
        if (featureId === 'screening-section') {
            // Screening uses different endpoint
            featureConfig = await getSavedScreeningFeature(doctorId);
        } else if (featureId === 'patient-profile') {
            // Patient profile uses its own endpoint
            featureConfig = await loadPatientProfileConfig(doctorId);
        } else {
            // Other features use general endpoint
            featureConfig = await getFeatureConfiguration(doctorId, featureId);
        }
    }
    
    await renderConfigForm(feature, category, featureConfig);
    
    // Update UI to reflect this feature is being configured
    renderCategories();
}

                if (!response.ok) throw new Error("Failed to fetch screening fields");

                const result = await response.json();
                console.log("data from vitals:",result)
                return {

            } catch (error) {

                }

                const res = await fetch(

        // Set up event listeners for configuration form
// Update setupConfigFormListeners to initialize trigger method
function setupConfigFormListeners(feature, category, featureConfig = null) {
    // Close button
    const closeBtn = document.getElementById("close-config");
    if (closeBtn) closeBtn.addEventListener("click", closeConfig);

    // Cancel button
    const cancelBtn = document.getElementById("cancel-config");
    if (cancelBtn) cancelBtn.addEventListener("click", closeConfig);

    // ✅ ADD SCREENING-SPECIFIC LOGIC HERE
    if (feature.id === "screening-section") {
        const urlParams = new URLSearchParams(window.location.search);
        const doctorId = urlParams.get("doctor_id");

        // Add field button
        const addFieldBtn = document.getElementById("add-screening-field");
        if (addFieldBtn) {
            addFieldBtn.addEventListener("click", () => {
                const container = document.getElementById("screening-fields");
                if (container) {
                    container.insertAdjacentHTML(
                        "beforeend",
                        screeningFieldRow()
                    );
                }
            });
        }

        // Remove field button delegation
        const fieldsContainer = document.getElementById("screening-fields");
        if (fieldsContainer) {
            fieldsContainer.addEventListener("click", (e) => {
                if (e.target.closest(".remove-field")) {
                    e.target.closest(".flex").remove();
                }
            });
        }

        // Save button (screening-specific)
        const saveBtn = document.getElementById("save-config");
        if (saveBtn) {
            saveBtn.addEventListener("click", () => saveConfig(feature, category));
        }

        // Cancel button (screening-specific)
        const cancelConfigBtn = document.getElementById("cancel-config");
        if (cancelConfigBtn) {
            cancelConfigBtn.addEventListener("click", closeConfig);
        }

        // ✅ Load screening data
        (async () => {
            // 1. Load saved fields
            const savedFeature = await getSavedScreeningFeature(doctorId);
            const savedFields = savedFeature?.screening_section?.fields || [];
            
            // 2. Get API vitals
            const { important, optional } = await getScreeningFields(doctorId);
            
            // 3. Clear container
            const container = document.getElementById("screening-fields");
            if (container) container.innerHTML = '';
            
            // 4. Determine what to display
            const fieldsToDisplay = savedFields.length > 0 ? savedFields : important;
            
            // 5. Populate fields
            fieldsToDisplay.forEach(field => {
                const fieldRow = `
                    <div class="flex items-center gap-3">
                        <input
                            type="text"
                            placeholder="Field name (e.g. Blood Pressure)"
                            value="${field}"
                            class="flex-1 px-4 py-2 border rounded-lg"
                        />
                        <button class="remove-field text-red-500">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', fieldRow);
            });
            
            // 6. Show optional vitals as chips
            renderOptionalVitalChips(optional);
        })();
        
        // Return early - don't execute other listeners for screening
        return;
    }
    // ✅ END OF SCREENING-SPECIFIC LOGIC

    // ✅ ADD PATIENT PROFILE-SPECIFIC LOGIC HERE
    if (feature.id === "patient-profile") {
        // Save button (patient-profile-specific)
        const saveBtn = document.getElementById("save-config");
        if (saveBtn) {
            saveBtn.addEventListener("click", () => savePatientProfileConfig(feature, category));
        }
        
        // Cancel button already handled above
        return; // Return early for patient profile
    }
    // ✅ END OF PATIENT PROFILE-SPECIFIC LOGIC

    // Initialize trigger method dropdown based on saved config
    const triggerMethod = document.getElementById("trigger-method");
    const buttonLabelContainer = document.getElementById("button-label-container");
    
    if (triggerMethod && buttonLabelContainer) {
        // Set initial state based on saved config
        if (featureConfig?.trigger?.type === "button-click") {
            buttonLabelContainer.classList.remove("hidden");
        }
        
        // Add change listener
        triggerMethod.addEventListener("change", (e) => {
            if (e.target.value === "button-click") {
                buttonLabelContainer?.classList.remove("hidden");
            } else {
                buttonLabelContainer?.classList.add("hidden");
            }
        });
    }
    
    // Test button
    const testBtn = document.getElementById("test-config");
    if (testBtn) {
        testBtn.addEventListener("click", () => testConfig(feature, category));
    }

    // Save button (for standard features)
    const saveBtn = document.getElementById("save-config");
    if (saveBtn) {
        saveBtn.addEventListener("click", () => saveConfig(feature, category));
    }
}

// Add separate function for saving patient profile
async function savePatientProfileConfig(feature, category) {
    feature.configured = true;

    const urlParams = new URLSearchParams(window.location.search);
    const doctorId = urlParams.get("doctor_id");

    const payload = buildPatientProfilePayload(feature, category);
    console.log("PATIENT PROFILE PAYLOAD:", payload);

    try {
        const response = await fetch(
            `${API_BASE}/hms/users/orchestration/doctor_patient_profile_save`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            }
        );

        if (!response.ok) {
            throw new Error("Failed to save patient profile configuration");
        }

        const result = await response.json();
        console.log("Server response:", result);

        // Update local state
        state.categories.forEach(cat => {
            cat.features.forEach(f => {
                if (f.id === "patient-profile") {
                    f.configured = true;
                    
                    f.name = feature.name; // Keep any updated name
                    
                }
            });
        });

        // Update the category enabled count
        category.enabledCount = category.features.filter(f => f.enabled).length;

        closeConfig();
        showSuccessToast(feature.name);
        updateActiveCount();
        renderCategories();

    } catch (error) {
        console.error(error);
        alert("Error saving patient profile configuration");
    }
}

// Toggle data source selection
function toggleDataSource(source) {
    const index = state.dataSources.selected.indexOf(source);
    if (index > -1) {
        state.dataSources.selected.splice(index, 1);
    } else {
        state.dataSources.selected.push(source);
    }
    
    // Re-render the config form section to show/hide lab/vitals sections
    if (state.configuredFeature) {
        const category = state.categories.find(c => 
            c.features.some(f => f.id === state.configuredFeature)
        );
        const feature = category.features.find(f => f.id === state.configuredFeature);
        
        if (feature && feature.id !== 'patient-profile') {
            renderConfigForm(feature, category);
        }
    }
}
       function buildPatientProfilePayload(feature, category) {
    // Get selected patient fields from checkboxes
    const selectedFields = [];
    document
        .querySelectorAll('#config-panel input[type="checkbox"]:checked')
        .forEach(cb => {
            // Only include patient field checkboxes, not others
            const field = state.patientProfileFields.all.find(f => f.id === cb.id);
            if (field) {
                selectedFields.push(cb.id);
            }
        });

    // Get display mode
    const displayMode = document.getElementById("display-mode")?.value || "detailed";

    const urlParams = new URLSearchParams(window.location.search);
    const doctorId = urlParams.get("doctor_id");

    return {
        feature_id: feature.id,
        feature_name: feature.name,
        category_id: category.id,
        doctor_id: doctorId,
        enabled: true, // Always enabled when saving
        configured: true,
        patient_profile: {
            fields: selectedFields,
            display_mode: displayMode
        },
        timestamp: new Date().toISOString()
    };
}

async function getSavedScreeningFeature(doctorId) {
    try {
        const res = await fetch(
            `${API_BASE}/hms/users/orchestration/doctor_screening_features/${doctorId}`
        );

        if (!res.ok) return null;

        const data = await res.json();

        return data.features?.find(
            f =>
                f.feature_id === "screening-section" &&
                f.enabled === true &&
                f.configured === true &&
                Array.isArray(f.screening_section?.fields) &&
                f.screening_section.fields.length > 0
        ) || null;

    } catch (e) {
        console.error("❌ Failed to load saved screening feature", e);
        return null;
    }
}


        async function saveConfig(feature, category) {
            feature.configured = true;

            const urlParams = new URLSearchParams(window.location.search);
            const doctorId = urlParams.get("doctor_id");

            let payload;
            let endpoint;

            // 🔀 Special handling for patient-profile
            if (feature.id === "patient-profile") {
                payload = buildPatientProfilePayload(feature, category);
                payload.doctor_id = doctorId;
                console.log("PATIENT PROFILE PAYLOAD:", payload); // for debugging
                endpoint = `${API_BASE}/hms/users/orchestration/doctor_patient_profile_save`;
            }
            else if (feature.id === "screening-section") {
                payload = buildScreeningPayload(feature, category);
                endpoint = `${API_BASE}/hms/users/orchestration/doctor_screening_feature_save`;
            }
            // 🔀 All other features
            else {
                payload = buildFeatureConfigJSON(feature, category);
                console.log("STANDARD FEATURE PAYLOAD:", payload); // for debugging
                payload.doctor_id = doctorId;
                payload.selected_output_categories = getSelectedOutputCategories();
                endpoint = `${API_BASE}/hms/users/orchestration/doctor-feature-save`;
            }

            console.log("FINAL PAYLOAD:", payload);

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error("Failed to save configuration");
                }

                const result = await response.json();
                console.log("Server response:", result);

                // closeConfig();
                showSuccessToast(feature.name);
                updateActiveCount();
                renderCategories();

            } catch (error) {
                console.error(error);
                alert("Error saving configuration");
            }
        }

        function renderOutputCategories(apiResponse) {
            const categories =
                apiResponse?.feature_output_categories?.possible_output_categories || [];

            const section = document.getElementById("output-categories-section");
            const container = document.getElementById("output-categories-container");

            if (!section || !container || categories.length === 0) return;

            // Clear old data
            container.innerHTML = "";

            categories.forEach(category => {
                const sectionName = category.section_name;
                const sectionId = category.section_id;

                const id = `output-${sectionId}`;

                container.insertAdjacentHTML(
                    "beforeend",
                    `
                    <div class="flex items-center">
                        <input
                            type="checkbox"
                            id="${id}"
                            name="output_categories"
                            value="${sectionId}"
                            class="h-5 w-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500"
                        />
                        <label for="${id}" class="ml-3 text-gray-700">
                            ${sectionName}
                        </label>
                    </div>
                    `
                );
            });


            // Reveal section
            section.classList.remove("hidden");
        }
